<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>随行录</title><link rel="stylesheet" href="/suixinglu.css"><style>.page{display:none}.page.active{display:block}.empty{text-align:center;padding:45px;color:#8ca2af}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:10px;border-radius:10px;background:#e6f5fd}.sheet{border:0;border-radius:20px;padding:20px;width:min(90vw,380px)}.sheet form{display:grid;gap:11px}.sheet input,.sheet textarea{padding:12px;border:1px solid #d8e9f2;border-radius:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.primary{background:#72c5f2!important;color:#fff!important}.logout{color:#d85f5f!important}</style></head><body><script>if(!localStorage.getItem('suixinglu_session'))location.replace('/suixinglu-login.html')</script><div class="phone-shell"><header class="topbar"><div><p id="todayLabel" class="kicker"></p><h1>你好，<span id="userName"></span> 👋</h1></div><button id="avatarBtn" class="avatar"></button></header><main class="screen"><section id="home" class="page active"><section class="hero-card"><div><span class="pill">今日进度</span><strong id="progress">0 / 0</strong><p>创建项目后开始记录</p></div><div class="ring"><span id="percent">0%</span></div></section><div class="section-head"><h2>项目</h2><button class="ghost newProject">新建项目</button></div><div class="projects projectList"></div></section><section id="timelinePage" class="page"><div class="section-head"><h2>时间线</h2><span class="ghost">北京时间</span></div><div id="timeline" class="timeline"></div></section><section id="projectsPage" class="page"><div class="section-head"><h2>项目管理</h2><button class="ghost newProject">新建项目</button></div><div class="projects projectList"></div></section><section id="detail" class="page"><div class="section-head"><button id="back" class="ghost">‹ 返回</button><button id="editProject" class="ghost">编辑项目</button></div><h2 id="projectTitle"></h2><div class="tools"><button id="voice">🎙️ 语音转文字</button><button id="photo">📷 照片记录</button><button id="newRecord" class="primary">＋ 新建事项</button></div><input id="photoInput" type="file" accept="image/*" multiple hidden><div id="projectRecords" class="timeline"></div></section><section id="profile" class="page"><div class="section-head"><h2>我的</h2></div><section class="profile-card"><div class="profile-main"><div id="profileAvatar" class="profile-avatar"></div><div><b id="profileName"></b><small id="account"></small></div></div><div class="stats"><div><strong id="pstat">0</strong><span>项目</span></div><div><strong id="rstat">0</strong><span>记录</span></div><div><strong id="dstat">0</strong><span>完成</span></div></div><div class="setting-list"><button>👤 个人资料 <span>编辑 ›</span></button><button>🔐 账号安全 <span>设置 ›</span></button><button>🪪 个人信息 <span>设置 ›</span></button><button>🔔 提醒设置 <span>设置 ›</span></button><button id="logout" class="logout">退出登录</button></div></section></section></main><nav class="tabbar"><button class="active" data-page="home"><span>⌂</span>首页</button><button data-page="timelinePage"><span>◷</span>时间线</button><button class="fab newProject"><span>＋</span></button><button data-page="projectsPage"><span>□</span>项目</button><button data-page="profile"><span>☻</span>我的</button></nav></div><dialog id="projectDialog" class="sheet"><form id="projectForm"><h3>新建项目</h3><input id="projectName" required placeholder="项目名称"><textarea id="projectDesc" placeholder="项目说明"></textarea><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog><dialog id="recordDialog" class="sheet"><form id="recordForm"><h3>新建事项</h3><input id="recordTitle" required placeholder="事项名称"><input id="recordTime" type="datetime-local" required><textarea id="recordText" placeholder="记录内容"></textarea><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog><div id="toast" class="toast"></div><script src="/suixinglu.js"></script></body></html>
