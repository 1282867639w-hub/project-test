<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>随行录 · 登录</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(160deg,#b9e6ff,#f5faff 55%);color:#16364c;min-height:100vh}.auth{max-width:430px;min-height:100vh;margin:auto;padding:70px 28px;background:#f5faffbb}.brand{width:68px;height:68px;border-radius:22px;background:#7bc9f7;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 12px 30px #62b8e955}.brand-title{font-size:30px;margin:20px 0 5px}.sub{color:#7895a7;margin:0 0 34px}.tabs{display:flex;background:#e6f3fb;padding:4px;border-radius:13px;margin-bottom:20px}.tabs button{flex:1;border:0;padding:10px;border-radius:10px;background:none;color:#7593a5;font-size:15px}.tabs .active{background:#fff;color:#287da8}form{display:grid;gap:14px}.field{display:grid;gap:7px;font-size:13px}.field input{border:1px solid #d7e8f2;border-radius:13px;padding:14px;background:#fff;font-size:15px}.submit{border:0;border-radius:14px;padding:14px;background:#70c3f1;color:#fff;font-size:16px;font-weight:700;margin-top:8px}.hint{text-align:center;color:#91a7b5;font-size:12px;margin-top:22px}.error{color:#d65e5e;font-size:12px;min-height:18px}</style></head><body><main class="auth"><div class="brand">随</div><h1 class="brand-title">随行录</h1><p class="sub">记录每个想法，推进每件重要的事</p><div class="tabs"><button id="loginTab" class="active" type="button">登录</button><button id="registerTab" type="button">注册</button></div><form id="authForm"><label class="field">账号<input id="account" required placeholder="手机号或邮箱"></label><label class="field">密码<input id="password" type="password" minlength="6" required placeholder="至少 6 位"></label><label class="field" id="nameField" hidden>昵称<input id="nickname" placeholder="怎么称呼你"></label><div class="error" id="error"></div><button class="submit" id="submitBtn">登录并进入随行录</button></form><p class="hint">测试版账号仅保存在当前设备，不会上传到网络</p></main><script>let mode='login',users=JSON.parse(localStorage.getItem('suixinglu_users')||'{}');function sw(m){mode=m;loginTab.classList.toggle('active',m==='login');registerTab.classList.toggle('active',m==='register');nameField.hidden=m==='login';nickname.required=m==='register';submitBtn.textContent=m==='login'?'登录并进入随行录':'注册并进入随行录';error.textContent=''}loginTab.onclick=()=>sw('login');registerTab.onclick=()=>sw('register');authForm.onsubmit=e=>{e.preventDefault();const a=account.value.trim(),p=password.value;if(mode==='register'){if(users[a]){error.textContent='该账号已注册';return}users[a]={password:p,name:nickname.value.trim()||'新用户'};localStorage.setItem('suixinglu_users',JSON.stringify(users))}else if(!users[a]||users[a].password!==p){error.textContent='账号或密码不正确';return}localStorage.setItem('suixinglu_session',JSON.stringify({account:a,name:users[a].name}));localStorage.setItem('suixinglu_name',users[a].name);location.replace('/suixinglu.html')};</script></body></html>
