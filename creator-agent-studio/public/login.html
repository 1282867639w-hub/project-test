<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#184d3a"><title>登录 · 灵感工坊</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1e9;color:#171814;font-family:"Microsoft YaHei",sans-serif}.box{width:min(88vw,380px);background:#fffdf8;border:1px solid #dcd7ca;border-radius:18px;padding:30px;box-shadow:0 20px 60px #17251c18}h1{font-family:Georgia,"Songti SC",serif;margin:0 0 8px}p{color:#6d7067;font-size:13px;line-height:1.7}input,button{width:100%;box-sizing:border-box;border-radius:9px;padding:13px;margin-top:12px;font:inherit}input{border:1px solid #dcd7ca;background:white}button{border:0;background:#184d3a;color:white;font-weight:700}.error{color:#b3342b;min-height:20px}</style></head><body><form class="box" id="login"><h1>灵感工坊</h1><p>请输入站点访问密码。密码只由服务端校验，不会发送给第三方模型。</p><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required><button>进入工作台</button><p id="error" class="error"></p></form><script>login.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok)location.href='/';else error.textContent=(await r.json()).error||'登录失败';};</script></body></html>
